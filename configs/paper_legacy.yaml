experiment:
  name: paper_legacy
  description: Legacy paper reproduction
flow:
  protocols: [tcp, udp]
  inactive_timeout_seconds: null
prefix:
  ip_version: 4
  candidate_sources: [dst_prefix]
  min_prefix_length: 24
  containment_strategy: prefer_broader
  membership_mode: dst_only
  normalized_24_enabled: false
  top_k: null
scan:
  window_size_seconds: 60
  window_step_seconds: 10
  window_anchor: capture_start
  window_membership: "[start,end)"
  strict:
    enabled: false
  broad:
    enabled: false
aguri:
  aguri3_executable: null
  agurim_executable: null
  options: []
analysis:
  overall_ip_scope: ipv4_ipv6
legacy:
  candidate_ip_scope: ipv4_ipv6
  prefix_len: 24
  min_flows: 100
  min_packets: 1000
  min_bytes: 100000
  max_short_flow_ratio: 0.8
  max_tiny_flow_ratio: 0.8
  max_syn_only_like_ratio: 0.5
  max_rst_observed_ratio: 0.8
  short_duration_threshold: 1.0
  tiny_packet_threshold: 3
  top_k: 10
  score_weights:
    flow_count: 0.20
    packet_count: 0.20
    byte_count: 0.20
    low_short_flow_ratio: 0.15
    low_tiny_flow_ratio: 0.15
    low_syn_only_like_ratio: 0.10
  plot_min_flow_count: 1000
