experiment:
  name: paper_legacy
  description: Legacy paper reproduction
flow:
  protocols: [tcp, udp]
  inactive_timeout_seconds: null
prefix:
  ip_version: 4
  candidate_sources: [dst_prefix]
  min_prefix_length: 24
  containment_strategy: prefer_broader
  membership_mode: dst_only
  normalized_24_enabled: false
  top_k: null
scan:
  window_size_seconds: 60
  window_step_seconds: 10
  window_anchor: capture_start
  window_membership: "[start,end)"
  strict:
    enabled: false
  broad:
    enabled: false
aguri:
  aguri3_executable: aguri3
  agurim_executable: agurim
  options: []
analysis:
  overall_ip_scope: ipv4_ipv6
