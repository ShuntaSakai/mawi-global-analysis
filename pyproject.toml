[project]
name = "mawi-global-analysis"
version = "0.1.0"
description = "Reproducible MAWI traffic analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dpkt>=1.9.8,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
    "pydantic>=2.8,<3",
    "jupyter>=1,<2",
    "ipykernel>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mawi_global_analysis"]
